name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please do not report security issues here; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or code
      description: The exact command or Python code you ran, including model ids.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output
      description: Full traceback or terminal output.
      render: text
  - type: input
    id: version
    attributes:
      label: Modeldiffr version
      placeholder: output of modeldiffr --version
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Python version, OS, GPU, torch and transformers versions
